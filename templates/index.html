<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TinySwallow Streaming Chat</title>

<!-- Markdown パーサ -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
/*
 Markdown表示設定
 - breaks: true → 改行を <br> に変換
*/
marked.setOptions({
    breaks: true,
    gfm: true
});
</script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
}

#chat {
    border: 1px solid #ccc;
    padding: 10px;
    height: 320px;
    overflow-y: auto;
    background: #fafafa;
}

.ai-message {
    line-height: 1.6;
}

.ai-message h1,
.ai-message h2,
.ai-message h3 {
    margin: 0.6em 0 0.3em;
}

.ai-message ul,
.ai-message ol {
    margin-left: 1.4em;
}

.ai-message pre {
    background: #f6f8fa;
    padding: 10px;
    border-radius: 4px;
    overflow-x: auto;
}

.ai-message code {
    background: #eee;
    padding: 2px 4px;
    border-radius: 3px;
}
</style>
</head>

<body>

<h2>TinySwallow Chat（Streaming + Markdown）</h2>

<div id="chat"></div>

<input id="input" style="width:80%;">
<button onclick="send()">送信</button>
<button onclick="stop()">終了</button>

<script>
let aiCounter = 0;
let evtSource = null;
let aiBuffer = "";

function send() {
    const input = document.getElementById("input");
    const message = input.value.trim();
    if (!message) return;

    input.value = "";

    const chat = document.getElementById("chat");
    chat.innerHTML += `<p><b>You:</b> ${message}</p>`;

    const aiId = "ai_" + aiCounter++;
    chat.innerHTML += `
        <p><b>AI:</b></p>
        <div id="${aiId}" class="ai-message"></div>
    `;

    const aiDiv = document.getElementById(aiId);
    aiBuffer = "";

    // 既存のストリームを停止
    if (evtSource) {
        evtSource.close();
        evtSource = null;
    }

    evtSource = new EventSource(
        "/chat_stream?message=" + encodeURIComponent(message)
    );

    evtSource.onmessage = function(event) {
        let text = event.data;

        /*
         【1】太字 (** ) の前は必ず改行
        */
        text = text.replace(/([^\n])(\*\*)/g, "$1\n$2");

        /*
         【2】数字箇条書き（1. 2. 3. ...）の前は必ず改行
        */
        text = text.replace(/([^\n])(\d+\.\s)/g, "$1\n$2");

        aiBuffer += text;

        // Markdown → HTML
        aiDiv.innerHTML = marked.parse(aiBuffer);
        chat.scrollTop = chat.scrollHeight;
    };

    evtSource.onerror = function() {
        evtSource.close();
        evtSource = null;
    };
}

function stop() {
    if (evtSource) {
        evtSource.close();
        evtSource = null;

        const chat = document.getElementById("chat");
        chat.innerHTML += "<p style='color:#888;'><i>--- 中断しました ---</i></p>";
    }
}
</script>

</body>
</html>
