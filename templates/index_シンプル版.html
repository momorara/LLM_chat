<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TinySwallow Streaming Chat</title>

<!-- Markdown ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
pre {
    background: #f6f8fa;
    padding: 8px;
    overflow-x: auto;
}
code {
    background: #eee;
    padding: 2px 4px;
}
</style>
</head>
<body>

<h2>TinySwallow Chat（ストリーミング + Markdown）</h2>

<div id="chat" style="border:1px solid #ccc; padding:10px; height:300px; overflow:auto;"></div>

<input id="input" style="width:80%;">
<button onclick="send()">送信</button>
<button onclick="stop()">終了</button>

<script>
let aiCounter = 0;
let evtSource = null;
let aiBuffer = ""; // ★ Markdown用バッファ

function send() {
    const input = document.getElementById("input");
    const message = input.value;
    if (!message) return;

    input.value = "";

    const chat = document.getElementById("chat");
    chat.innerHTML += "<p><b>You:</b> " + message + "</p>";

    const aiId = "ai_" + aiCounter++;
    chat.innerHTML += `<p><b>AI:</b></p><div id="${aiId}"></div>`;
    const aiDiv = document.getElementById(aiId);

    // 初期化
    aiBuffer = "";

    if (evtSource) {
        evtSource.close();
        evtSource = null;
    }

    evtSource = new EventSource(
        "/chat_stream?message=" + encodeURIComponent(message)
    );

    evtSource.onmessage = function(event) {
        aiBuffer += event.data;

        // Markdown → HTML
        aiDiv.innerHTML = marked.parse(aiBuffer);

        chat.scrollTop = chat.scrollHeight;
    };

    evtSource.onerror = function() {
        evtSource.close();
        evtSource = null;
    };
}

function stop() {
    if (evtSource) {
        evtSource.close();
        evtSource = null;

        const chat = document.getElementById("chat");
        chat.innerHTML += "<p style='color:gray;'><i>--- 中断しました ---</i></p>";
    }
}
</script>

</body>
</html>
